name: Python CI/CD for 3D Annotation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Build, Lint, and Test (on CPU)
  build-and-test:
    name: Build and Test (CPU)
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        # Install PyTorch for CPU first
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        # Install remaining dependencies
        pip install -r requirements.txt

    - name: Lint with Black
      run: |
        # Run black to check for formatting errors
        black . --check --diff

    - name: Download test models
      run: |
        mkdir -p weights
        # Download SMALLEST models for a fast CI test
        echo "Downloading small models for CI..."
        wget https://github.com/ultralytics/assets/releases/download/v0.0.0/yolov8n.pt -O weights/yolov8n.pt
        wget https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth -O weights/sam_vit_b_01ec64.pth

    - name: Run Smoke Test
      run: |
        echo "Running smoke test..."
        # 1. Run with --help (fast check)
        python3 advanced_annotater.py --help
        
        # 2. Run on a tiny dummy dataset (create dummy data first)
        mkdir -p test_data/images test_data/pcds test_output
        # Create a tiny 10x10 black image
        python3 -c "import cv2, numpy; cv2.imwrite('test_data/images/001.png', numpy.zeros((10, 10, 3)))"
        # Create a tiny 3-point PCD file
        echo -e '# .PCD v.7\nVERSION .7\nFIELDS x y z\nSIZE 4 4 4\nTYPE F F F\nCOUNT 1 1 1\nWIDTH 3\nHEIGHT 1\nVIEWPOINT 0 0 0 1 0 0 0\nPOINTS 3\nDATA ascii\n0 0 0\n1 1 1\n2 2 2' > test_data/pcds/001.pcd
        
        # Run the script. It will fail on the 3-point check, which is fine.
        # We just want to ensure it runs without crashing on setup.
        # We use a special test config file
        python3 advanced_annotater.py --data test_data/images --pcd_dir test_data/pcds --config test_config.yml --output_dir test_output

    - name: Upload test artifacts
      # 'always()' ensures this runs even if the smoke test fails, so we can see the logs
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: test-output-artifacts
        path: test_output/

  # Job 2: Package and Push Docker Image
  package-docker:
    name: Package and Push Docker Image
    # This job 'needs' the first one to pass
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only run this job when pushing to the 'main' branch (i.e., not on Pull Requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        # 'github.actor' is your GitHub username
        username: ${{ github.actor }}
        # 'GITHUB_TOKEN' is a special secret automatically provided by GitHub Actions
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # This tags the image with your repo name and a unique ID (the git commit SHA)
        # Example: ghcr.io/your-username/your-repo:a1b2c3d
        # tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
        # This also tags the image as 'latest'
        # Example: ghcr.io/your-username/your-repo:latest
        tags: ghcr.io/${{ github.repository }}:latest
